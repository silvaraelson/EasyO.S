services:
  - type: web
    name: easy-os-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install -g pnpm@9.15.9 && pnpm install --frozen-lockfile && pnpm exec turbo run build --filter=@easy-os/api...
    startCommand: pnpm --filter @easy-os/api start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false

  - type: web
    name: easy-os-web
    runtime: static
    plan: free
    buildCommand: npm install -g pnpm@9.15.9 && pnpm install --frozen-lockfile && pnpm exec turbo run build --filter=@easy-os/web...
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://easy-os-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
